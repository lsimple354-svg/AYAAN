<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="190" fill="url(#glowGrad)"/>

  <!-- Candlesticks Background -->
  <!-- Candle 1 -->
  <line x1="140" y1="210" x2="140" y2="350" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <rect x="125" y="240" width="30" height="80" rx="6" fill="#10b981"/>

  <!-- Candle 2 (Bearish small) -->
  <line x1="200" y1="250" x2="200" y2="380" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" stroke-opacity="0.7"/>
  <rect x="185" y="270" width="30" height="60" rx="6" fill="#f43f5e" fill-opacity="0.7"/>

  <!-- Candle 3 (Bullish Expansion) -->
  <line x1="260" y1="170" x2="260" y2="330" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <rect x="245" y="195" width="30" height="95" rx="6" fill="#10b981"/>

  <!-- Candle 4 (High peak) -->
  <line x1="320" y1="130" x2="320" y2="290" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <rect x="305" y="150" width="30" height="90" rx="6" fill="#34d399"/>

  <!-- Dynamic Compounding Upward Curve -->
  <path d="M 100 370 Q 230 350, 310 210 T 420 120" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Target Arrow Tip -->
  <polygon points="420,105 435,135 405,130" fill="#38bdf8"/>

  <!-- Ayaan 'A' Letter Monogram / Vault Emblem -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="4">AYAAN</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#10b981" text-anchor="middle" letter-spacing="8">TRADING</text>
</svg>
